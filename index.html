<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Selamat Ulang Tahun, Mama 💐</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 25px;
      padding: 40px 30px;
      text-align: center;
      color: white;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      backdrop-filter: blur(14px);
      animation: popUp 2s ease;
      max-width: 360px;
      z-index: 2;
    }

    .icon {
      font-size: 60px;
      animation: glow 1.5s infinite alternate;
    }

    h1 {
      margin-top: 10px;
      font-size: 1.9em;
      animation: fadeIn 2s ease;
    }

    .name {
      font-size: 1.25em;
      font-weight: bold;
      color: #fff3b0;
      margin-top: 8px;
    }

    .typing {
      font-size: 1.05em;
      line-height: 1.6;
      margin-top: 14px;
      min-height: 110px;
    }

    .from {
      margin-top: 18px;
      font-size: 1em;
      opacity: 0.9;
    }

    @keyframes popUp {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px white; }
      to   { text-shadow: 0 0 20px #fff; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .flower {
      position: absolute;
      bottom: -50px;
      font-size: 26px;
      animation: float 7s linear infinite;
      opacity: 0.8;
    }

    .f1 { left: 12%; animation-delay: 0s; }
    .f2 { left: 38%; animation-delay: 2s; }
    .f3 { left: 65%; animation-delay: 4s; }
    .f4 { left: 88%; animation-delay: 1s; }

    @keyframes float {
      from { transform: translateY(0); opacity: 1; }
      to   { transform: translateY(-120vh); opacity: 0; }
    }

    .hint {
      position: absolute;
      bottom: 15px;
      font-size: 0.85em;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="flower f1">🌷</div>
  <div class="flower f2">🌸</div>
  <div class="flower f3">💐</div>
  <div class="flower f4">🌹</div>

  <audio id="bgMusic" loop>
    <source src="untuk_m.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <div class="icon">💐</div>
    <h1>Selamat Ulang Tahun, Mama</h1>
    <div class="name">Mamaku Tercinta ❤️</div>

    <div class="typing" id="typing"></div>

    <div class="from">— Dengan cinta dan hormat, dari anakmu 💛</div>
  </div>

  <div class="hint">Sentuh layar untuk memulai musik 🎵</div>

  <script>
    const text = "Terima kasih atas semua kasih sayang yang tak pernah habis, doa yang tak pernah putus, dan pengorbanan yang tak pernah lelah. Semoga di usia Mama yang bertambah ini, Allah selalu memberikan kesehatan, kebahagiaan, umur yang panjang, serta keberkahan dalam setiap langkah kehidupan. Aku selalu bangga menjadi anak Mama. 🤍";

    let i = 0;
    function typingEffect() {
      if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typingEffect, 45);
      }
    }
    typingEffect();

    // AUTOPLAY AMAN (tap di mana saja)
    let started = false;
    document.body.addEventListener("click", function () {
      if (!started) {
        document.getElementById("bgMusic").play();
        started = true;
      }
    });
  </script>

</body>
</html>
